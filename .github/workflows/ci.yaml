name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci
      
      - name: Run ESLint Fix (fail on warnings)
        run: npm run lint:fix

      - name: Run ESLint (fail on warnings)
        run: npm run lint -- --max-warnings=0

      - name: Build (Vite)
        run: npm run build

      - name: Test (Jest + RTL)
        run: npm run test:ci
