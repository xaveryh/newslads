name: Deploy To Production

on:
  push:
    branches: [main]
jobs:

  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_NAME }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Retrieve latest image from ACR
        run: docker pull ${{ secrets.REGISTRY_NAME }}/staging:latest

      - name: Retag image
        run: docker tag ${{ secrets.REGISTRY_NAME }}/staging:latest ${{ secrets.REGISTRY_NAME }}/production:latest

      - name: Push image to production
        run: docker push ${{ secrets.REGISTRY_NAME }}/production:latest
