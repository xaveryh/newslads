# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Build and Push Image CD To Staging

on:
  push:
    branches: [ "staging", "setup/cd" ]
  pull_request:
    branches: [ "staging", "setup/cd" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Add NEWS API token to a .env file
      run: echo "VITE_NEWS_API_TOKEN=${{ secrets.NEWS_API_TOKEN }}" > .env

    - name: Build code
      run: npm run build

    - name: Set Docker image name
      run: echo "IMAGE_NAME=${{ secrets.REGISTRY_NAME }}/staging" >> $GITHUB_ENV

    - name: Set Docker image tag to environment
      run: echo "IMAGE_TAG=$(date +%s)" >> $GITHUB_ENV

    - name: Login to ACR
      uses: docker/login-action@v2
      with:  
        registry: ${{ secrets.REGISTRY_NAME }}
        username: ${{ secrets.REGISTRY_USERNAME }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    - name: Dockerise bundled code
      run: docker build --file Dockerfile --tag $IMAGE_NAME:$IMAGE_TAG --tag $IMAGE_NAME:latest dist/

    - name: Push image with datetime tag to ACR
      run: docker push $IMAGE_NAME:$IMAGE_TAG 

    - name: Push image with latest tag to ACR
      run: docker push $IMAGE_NAME:latest
