name: Lint

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20   # or 22 if your project supports it
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run ESLint (fail on warnings)
        run: npm run lint -- --max-warnings=0
        # if you prefer warnings not to fail CI, just: npm run lint

